# Configuración mínima para `supabase start` en local. Referencia completa:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "monterroso-chat"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
# Sin registro abierto: los usuarios se crean a mano o con scripts/seed-demo.ts.
enable_signup = false
enable_anonymous_sign_ins = false

[functions.assistant]
verify_jwt = true
